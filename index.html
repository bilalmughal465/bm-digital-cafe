function beep() {
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ctx = new AC();
    [0, 0.18].forEach(function (delay) {
      const o = ctx.createOscillator();
      const g = ctx.createGain();
      o.type = 'sine'; o.frequency.value = 880;
      g.gain.setValueAtTime(0.0001, ctx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(0.2, ctx.currentTime + delay + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + delay + 0.15);
      o.connect(g); g.connect(ctx.destination);
      o.start(ctx.currentTime + delay); o.stop(ctx.currentTime + delay + 0.18);
    });
  } catch (e) { /* audio unavailable in this browser */ }
}

/* ---------- Menu, cart, checkout ---------- */

function effectiveMenu() {
  return MENU.map(function (m) {
    const ed = state.menuEdits[m.id] || {};
    return {
      id: m.id, name: m.name, desc: m.desc, cat: m.cat, coffee: m.coffee,
      glyph: m.glyph, bestseller: m.bestseller, photo: (ed.photo || ''),
      price: (ed.price !== undefined) ? ed.price : m.price,
      soldOut: (ed.soldOut !== undefined) ? ed.soldOut : m.soldOut
    };
  });
}

function unitPrice(m, size) {
  if (!m.coffee) return m.price;
  if (size === 'Small') return m.price - 50;
  if (size === 'Large') return m.price + 100;
  return m.price;
}

function parseKey(key) {
  const parts = key.split('|');
  return { id: parts[0], size: parts[1] || 'Medium', milk: parts[2] || 'Regular' };
}

function cartCount() {
  return Object.keys(cart).reduce(function (sum, k) { return sum + cart[k]; }, 0);
}

function cartTotal() {
  return Object.keys(cart).reduce(function (sum, k) {
    const p = parseKey(k);
    const m = effectiveMenu().find(function (x) { return x.id === p.id; });
    return sum + (m ? unitPrice(m, p.size) * cart[k] : 0);
  }, 0);
}

function cartCoffeeQty() {
  return Object.keys(cart).reduce(function (sum, k) {
    const p = parseKey(k);
    const m = effectiveMenu().find(function (x) { return x.id === p.id; });
    return sum + ((m && m.coffee) ? cart[k] : 0);
  }, 0);
}

function addToCart(id) {
  const m = effectiveMenu().find(function (x) { return x.id === id; });
  if (!m) return;
  if (m.soldOut) {
    showToast(m.name + ' khatam hai (sold out).');
    return;
  }
  if (m.coffee) {
    openOptionSheet(id);
    return;
  }
  cart[id] = (cart[id] || 0) + 1;
  renderAll();
}

function changeQty(key, delta) {
  cart[key] = (cart[key] || 0) + delta;
  if (cart[key] <= 0) delete cart[key];
  renderAll();
}

function menuGridHtml() {
  const q = (state.menuSearch || '').toLowerCase();
  const items = effectiveMenu().filter(function (m) {
    if (menuCat !== 'all' && m.cat !== menuCat) return false;
    if (q && m.name.toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  if (items.length === 0) return '<p class="muted center">Koi item nahi mila.</p>';
  return '<div class="menu-grid">' + items.map(function (m) {
    const qtyHtml = m.soldOut
      ? '<span class="soldout-badge">KHATAM</span>'
      : (function () {
          const keys = Object.keys(cart).filter(function (k) { return parseKey(k).id === m.id; });
          const totalQty = keys.reduce(function (s, k) { return s + cart[k]; }, 0);
          if (totalQty === 0) return '<button class="btn btn-small" onclick="addToCart(\'' + m.id + '\')">' + t('add') + '</button>';
          const firstKey = keys[0];
          return '<span class="qty"><button onclick="changeQty(\'' + firstKey + '\', -1)">-</button><b>' + totalQty + '</b><button onclick="changeQty(\'' + firstKey + '\', 1)">+</button></span>';
        })();
    const head = m.photo
      ? '<img class="tile-photo" src="' + m.photo + '" alt=""><div class="tile-top" style="padding-top:10px"><b>' + m.name + '</b></div>'
      : '<div class="tile-top"><div class="tile-visual"><div class="tile-glyph">' + m.glyph + '</div></div><b>' + m.name + '</b></div>';
    return '<div class="tile tile-' + m.cat + '">' + head +
      '<div class="tile-body"><span>' + m.desc + '</span>' + (m.bestseller ? '<br><span class="tag">' + t('bestseller') + '</span>' : '') +
      '<div class="price" style="margin-top:6px">' + fmt(m.price) + '</div>' + qtyHtml + '</div></div>';
  }).join('') + '</div>';
}

function renderMenu() {
  const catBtn = function (id, label) {
    return '<button class="' + (menuCat === id ? 'active' : '') + '" onclick="setMenuCat(\'' + id + '\')">' + label + '</button>';
  };

  document.getElementById('view-menu').innerHTML =

function openCheckout() {
  const lines = Object.keys(cart).filter(function (k) { return cart[k] > 0; }).map(function (k) {
    const p = parseKey(k);
    const m = effectiveMenu().find(function (x) { return x.id === p.id; });
    const label = m.name + (m.coffee ? ' (' + sizeLabel(p.size) + ', ' + milkLabel(p.milk) + ')' : '');
    return '<div class="cart-line"><span>' + esc(label) + ' x ' + cart[k] + '</span><span>' + fmt(unitPrice(m, p.size) * cart[k]) + '</span></div>';
  }).join('');
  if (!lines) {
    showToast('Your cart is empty. Add an item first.');
    return;
  }
  openModal(t('checkout'),
    lines + '<div class="total-line"><span>Total</span><span>' + fmt(cartTotal()) + '</span></div>' +
    '<p class="muted">Har coffee par 1 stamp milta hai — staff approval ke baad (Owner View ke Stamps tab me). Stamp ke liye number zaroori hai.</p>' +

    '<label class="checkbox-row"><input type="checkbox" ' + (state.guestConsent ? 'checked' : '') + ' onchange="state.guestConsent = this.checked"><span>Offers ke liye ijazat — comeback offers sirf ijazat wale customers ko bheji jati hain.</span></label>' +
    '<p class="muted">Table number (real version me table QR se khud aa jayega):</p>' +
    '<input type="text" placeholder="Table number, e.g. T4" value="' + esc(state.tableNo) + '" oninput="state.tableNo = this.value">' +
    '<p class="muted" style="margin-top:10px">Note (e.g. kam cheeni):</p>' +
    '<input type="text" placeholder="Note" value="' + esc(state.orderNote) + '" oninput="state.orderNote = this.value">' +
    '<div class="center mt"><button class="btn btn-gold" onclick="placeOrder()">' + t('placeOrder') + '</button> <button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>');
}

function placeOrder() {
  const entries = Object.keys(cart).filter(function (k) { return cart[k] > 0; });
  if (entries.length === 0) {
    showToast('Your cart is empty. Add an item first.');
    return;
  }
  let total = 0;
  let coffeeQty = 0;
  const items = entries.map(function (k) {
    const p = parseKey(k);
    const m = effectiveMenu().find(function (x) { return x.id === p.id; });
    const up = unitPrice(m, p.size);
    total += up * cart[k];
    if (m.coffee) coffeeQty += cart[k];
    return { name: m.name + (m.coffee ? ' (' + sizeLabel(p.size) + ', ' + milkLabel(p.milk) + ')' : ''), qty: cart[k], price: up };
  });
  const phone = (state.cartPhone || '').trim();
  const orderId = 'ORD-' + Date.now();
  state.orders.unshift({
    id: orderId, customer: phone ? 'Guest (' + phone + ')' : 'Demo Guest',
    items: items, total: total, date: 'Today', hour: new Date().getHours(),
    status: 'ban raha hai', table: state.tableNo || '-', note: state.orderNote || '', noStamp: !phone
  });
  if (phone) state.pendingStamps += coffeeQty;
  cart = {};
  save();
  beep();
  closeModal();
  tab = 'stamps';
  renderAll();
  showToast(phone ? 'Order ho gaya. Stamp staff lagayega.' : 'Order ho gaya. Stamp ke liye number zaroori hai.');
  setTimeout(function () {
    const o = state.orders.find(function (x) { return x.id === orderId; });
    if (o && o.status === 'ban raha hai') {
      o.status = 'tayyar hai';
      save();
      renderAll();
      showToast('Order ' + orderId + ' tayyar hai!');
    }
  }, 12000);
}

function advanceOrder(id) {
  const o = state.orders.find(function (x) { return x.id === id; });
  if (!o) return;
  o.status = 'tayyar hai';
  save();
  renderAll();
  showToast('Order ' + id + ' tayyar hai!');
}

    '<p class="muted" style="margin-top:10px">Note (e.g. kam cheeni):</p>' +

    '</div></div>';
  wrap.classList.remove('hidden');
}

function setSheetOpt(kind, v) {
  if (kind === 'size') sheetSize = v;
  else sheetMilk = v;
  renderSheet();
}

function sheetConfirm() {
  const m = effectiveMenu().find(function (x) { return x.id === sheetItem; });
  if (!m) { closeSheet(); return; }
  const key = sheetItem + '|' + sheetSize + '|' + sheetMilk;
  cart[key] = (cart[key] || 0) + 1;
  if (sheetTable.trim()) state.tableNo = sheetTable.trim();
  state.orderNote = sheetNote;
  closeSheet();
  renderAll();

function closeSheet() {

/* ---------- Come Back List ---------- */

function dayBadge(days) {
  if (days >= 45) return '<span class="day-badge day-red">' + days + ' din</span>';
  if (days >= 30) return '<span class="day-badge day-orange">' + days + ' din</span>';
  if (days >= 21) return '<span class="day-badge day-yellow">' + days + ' din</span>';
  return '<span class="day-badge day-grey">' + days + ' din</span>';
}

function segmentList() {
  if (comebackFilter === 'vip') return state.customers.filter(function (c) { return c.orders >= 5; });
  if (comebackFilter === 'naye') return state.customers.filter(function (c) { return c.orders <= 1; });
  return state.customers.filter(function (c) { return c.days >= 21; }).sort(function (a, b) { return b.days - a.days; });
}

function setComebackFilter(f) {
  comebackFilter = f;
  renderComeback();
}

function renderComeback() {
  const list = segmentList();
  const capReached = state.sentToday >= CONFIG.offerSendLimitPerDay;
  const segBtn = function (id, label) {
    return '<button class="' + (comebackFilter === id ? 'active' : '') + '" onclick="setComebackFilter(\'' + id + '\')">' + label + '</button>';
  };
  let rows = '';
  if (list.length === 0) {
    rows = '<p class="muted">Is segment me koi customer nahi hai.</p>';
  } else {
    rows = list.map(function (c) {
      const sent = !!state.sentOffers[c.id];
      const ret = !!state.returned[c.id];
      let action = '';
      if (!c.consent) {
        action = '<button class="btn btn-small btn-wa" disabled>WhatsApp</button><br><span class="muted">no consent</span>';
      } else if (ret) {
        action = '<span class="sent-badge">Wapas aaye ✓</span>';
      } else if (sent) {
        action = '<span class="sent-badge">Offer sent ✓</span><br><button class="btn btn-small btn-outline" style="margin-top:6px" onclick="markReturned(\'' + c.id + '\')">Wapas aa gaye?</button>';
      } else if (capReached) {
        action = '<button class="btn btn-small btn-wa" disabled>WhatsApp</button><br><span class="muted">had poori</span>';
      } else {
        action = '<button class="btn btn-small btn-wa" onclick="openOffer(\'' + c.id + '\')">WhatsApp</button>';
      }
      return '<div class="row"><div><b>' + esc(c.name) + '</b> ' + dayBadge(c.days) + '<br><span>' + esc(c.phone) + ' — ' + c.orders + ' past orders' + (c.consent ? '' : ' — no consent') + '</span></div><div style="text-align:right">' + action + '</div></div>';
    }).join('');
  }
  document.getElementById('view-comeback').innerHTML =
    '<div class="banner-demo"><b>OWNER VIEW — DEMO by BM Digital — fictional demo data.</b></div>' +
    '<div class="card"><h2>' + t('comeback') + '</h2><p class="muted">Offers sirf un customers ko jinhon ne number dete waqt ijazat di ho. Aaj ' + state.sentToday + '/' + CONFIG.offerSendLimitPerDay + ' offers (demo had).</p>' +
    '<div class="cat-tabs">' + segBtn('door', '21+ din door') + segBtn('vip', 'VIP') + segBtn('naye', 'Naye') + '</div>' + rows + '</div>';
}

function offerText(c, templateId) {
  const tpl = OFFER_TEMPLATES.find(function (x) { return x.id === templateId; }) || OFFER_TEMPLATES[0];
  return 'Hi ' + c.name + '! We miss you at ' + CONFIG.cafeName + '. ' + tpl.text + ' — just show this message at the counter. Offer 7 din ke liye valid hai. See you soon! — ' + CONFIG.cafeName + ' (Demo offer)';
}

function openOffer(id) {
  const c = state.customers.find(function (x) { return x.id === id; });
  if (!c) return;
  if (!c.consent) {
    showToast('Is customer ne offers ki ijazat nahi di (no consent).');
    return;
  }
  if (state.sentToday >= CONFIG.offerSendLimitPerDay) {
    showToast('Aaj ki offer had (' + CONFIG.offerSendLimitPerDay + ') poori ho gayi.');
    return;
  }
  renderOfferModal(id);
}

function renderOfferModal(id) {
  const c = state.customers.find(function (x) { return x.id === id; });
  if (!c) return;
  const opts = OFFER_TEMPLATES.map(function (tpl) {
    return '<option value="' + tpl.id + '"' + (offerTemplate === tpl.id ? ' selected' : '') + '>' + tpl.label + '</option>';
  }).join('');
  openModal('WhatsApp Offer Preview — ' + esc(c.name),
    '<p class="muted">To (demo number): ' + esc(c.phone) + '</p>' +
    '<p class="muted">Offer template:</p><select onchange="offerTemplate = this.value; renderOfferModal(\'' + c.id + '\');">' + opts + '</select>' +
    '<div class="preview-box" style="margin-top:10px">' + esc(offerText(c, offerTemplate)) + '</div>' +
    '<p class="muted center">Demo only — tapping Send only marks this offer as sent in the demo. No message is actually sent. Offer 7 din ke liye valid hai.</p>' +
    '<div class="center mt"><button class="btn btn-gold" onclick="sendOfferSim(\'' + c.id + '\')">Simulate Send</button> <button class="btn btn-outline" onclick="closeModal()">Cancel</button></div>');
}

function sendOfferSim(id) {
  state.sentOffers[id] = true;
  state.sentToday += 1;
  save();
  renderAll();
  closeModal();
  showToast('Offer marked as sent (demo only).');
}

function markReturned(id) {
  state.returned[id] = true;
  save();
  renderAll();
  showToast('Customer wapas aa gaya — dashboard me count barh gaya.');
}

/* ---------- Dashboard ---------- */

function weeklyChartData() {
  const labels = ['19', '20', '21', '22', '23', '24', 'Today'];
  const counts = { '19': 0, '20': 0, '21': 0, '22': 0, '23': 0, '24': 0, 'Today': 0 };
  state.orders.forEach(function (o) {
    if (o.date === 'Today') { counts['Today'] += 1; return; }
    const day = parseInt(o.date, 10);
    if (counts[String(day)] !== undefined) counts[String(day)] += 1;
  });
  return labels.map(function (l) { return { label: l, count: counts[l] }; });
}

function renderDashboard() {
  const orders = state.orders;
  const revenue = orders.reduce(function (sum, o) { return sum + o.total; }, 0);
  const repeat = state.customers.filter(function (c) { return c.orders >= 2; }).length;
  const newC = state.customers.filter(function (c) { return c.orders <= 1; }).length;
  const avgBill = orders.length > 0 ? Math.round(revenue / orders.length) : 0;
  const rewardCost = state.you.claimed * 600 + state.you.dessertClaimed * 800;
  const returnedCount = Object.keys(state.returned).length;
  const buckets = { Morning: 0, Afternoon: 0, Evening: 0 };
  orders.forEach(function (o) {
    if (o.hour < 12) buckets.Morning += 1;
    else if (o.hour < 17) buckets.Afternoon += 1;
    else buckets.Evening += 1;
  });
  let peak = 'Morning';
  if (buckets.Afternoon >= buckets[peak]) peak = 'Afternoon';
  if (buckets.Evening >= buckets[peak]) peak = 'Evening';
  const itemCounts = {};
  orders.forEach(function (o) {
    o.items.forEach(function (it) {
      itemCounts[it.name] = (itemCounts[it.name] || 0) + it.qty;
    });
  });
  const topItems = Object.keys(itemCounts).map(function (name) {
    return { name: name, qty: itemCounts[name] };
  }).sort(function (a, b) { return b.qty - a.qty; }).slice(0, 3);
  const topHtml = topItems.map(function (tt, i) {
    return '<div class="row"><div><b>' + (i + 1) + '. ' + esc(tt.name) + '</b></div><span>' + tt.qty + ' sold</span></div>';
  }).join('');
  const chart = weeklyChartData();
  const maxC = Math.max.apply(null, chart.map(function (b) { return b.count; }).concat([1]));
  const chartHtml = '<div class="chart">' + chart.map(function (b) {
    const h = Math.round((b.count / maxC) * 100);
    return '<div class="bar-wrap"><div class="bar-val">' + b.count + '</div><div class="bar" style="height:' + h + '%"></div><div class="bar-label">' + b.label + '</div></div>';
  }).join('') + '</div>';
  const latest = orders[0];
  let slipHtml = '<p class="muted">Abhi koi order nahi hai.</p>';
  if (latest) {
    const slipLines = latest.items.map(function (it) { return esc(it.name) + ' x ' + it.qty + ' — ' + fmt(it.price * it.qty); }).join('<br>');
    slipHtml = '<div class="slip"><b>' + esc(latest.id) + '</b> — ' + esc(latest.customer) + '<br>' + slipLines +
      '<br>Table: ' + esc(latest.table || '-') + (latest.note ? ' — Note: ' + esc(latest.note) : '') +
      '<br>Status: ' + esc(latest.status) + '<br><b>Total: ' + fmt(latest.total) + '</b></div>' +
      '<div class="center mt"><button class="btn btn-small" onclick="beep()">Beep bajao (demo)</button> <button class="btn btn-small btn-outline" onclick="printSlip()">Slip print karo</button>' +
      (latest.status === 'ban raha hai' ? ' <button class="btn btn-small btn-gold" onclick="advanceOrder(\'' + latest.id + '\')">Tayyar karo</button>' : '') + '</div>';
  }
  const adminRows = effectiveMenu().map(function (m) {
    return '<div class="row"><div><b>' + esc(m.name) + '</b>' + (m.photo ? '<br><span>Photo lagi hai \u2713</span>' : '') + '</div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end"><input type="number" style="width:110px" value="' + m.price + '" onchange="setPrice(\'' + m.id + '\', this.value)"><label style="font-size:13px"><input type="checkbox" style="width:20px;height:20px" ' + (m.soldOut ? 'checked' : '') + ' onchange="setSoldOut(\'' + m.id + '\', this.checked)"> Khatam</label><input type="file" accept="image/*" style="width:150px;font-size:12px" onchange="setPhoto(\'' + m.id + '\', this)"></div></div>';
  }).join('');
  const customersHtml = state.customers.map(function (c) {
    return '<div class="row"><div><b>' + esc(c.name) + '</b><br><span>' + esc(c.phone) + ' — Last visit ' + c.days + ' days ago' + (c.consent ? '' : ' — no consent') + '</span></div><span>' + c.stamps + ' stamps · ' + c.orders + ' orders</span></div>';
  }).join('');
  const reviewsHtml = state.reviews.map(function (r) {
    let stars = '';
    for (let i = 0; i < 5; i++) stars += (i < r.stars ? '★' : '☆');
    return '<div class="row"><div><b>' + esc(r.name) + '</b> <span style="color:#C9A227">' + stars + '</span><br><span>' + esc(r.text) + '</span></div></div>';
  }).join('');
  const fbHtml = state.privateFeedback.length === 0
    ? '<p class="muted">Abhi koi private feedback nahi hai.</p>'
    : state.privateFeedback.map(function (f) {
        return '<div class="row"><div><b>' + esc(f.name) + '</b><br><span>' + esc(f.text) + '</span></div></div>';
      }).join('');
  document.getElementById('view-dashboard').innerHTML =
    '<div class="banner-demo"><b>OWNER VIEW — DEMO by BM Digital — fictional demo data.</b></div>' +
    '<div class="card"><h2>' + t('dashboard') + '</h2><div class="stat-grid">' +
    '<div class="stat"><b>' + orders.length + '</b><span>Recent orders</span></div>' +
    '<div class="stat"><b>' + fmt(revenue) + '</b><span>Recent revenue</span></div>' +
    '<div class="stat"><b>' + state.customers.length + '</b><span>Demo customers</span></div>' +
    '<div class="stat"><b>' + repeat + '</b><span>Repeat customers</span></div>' +
    '<div class="stat"><b>' + Object.keys(state.sentOffers).length + '</b><span>Comeback offers sent (demo)</span></div>' +
    '<div class="stat"><b>' + returnedCount + '</b><span>Customers wapas aaye</span></div>' +
    '</div>' +
    '<h3>Is hafte ke orders</h3>' + chartHtml +
    '<h3>Extras</h3>' +
    '<div class="row"><div><b>Peak hours</b></div><span>' + peak + ' (' + buckets[peak] + ' orders)</span></div>' +
    '<div class="row"><div><b>Average bill</b></div><span>' + fmt(avgBill) + '</span></div>' +
    '<div class="row"><div><b>Naye vs purane</b></div><span>' + newC + ' naye · ' + repeat + ' purane</span></div>' +
    '<div class="row"><div><b>Inam par kharcha (demo)</b></div><span>' + fmt(rewardCost) + '</span></div>' +
    '<p class="muted"><b>Weekly report:</b> is hafte ' + returnedCount + ' customers wapas aaye, ' + (state.you.claimed + state.you.dessertClaimed) + ' inam diye gaye.</p>' +
    '<h3>Top items</h3>' + topHtml +
    '<h3>Kitchen — Fresh Order</h3>' + slipHtml +
    '<h3>Stamps — Approval</h3><p class="muted">Pending stamps: ' + state.pendingStamps + '. Approve karne ke liye Stamps tab kholo.</p>' +
    '<div class="center mt"><button class="btn btn-gold" onclick="setTab(\'stamp-approval\')">Stamps tab kholo</button></div>' +
    '<h3>Menu Admin</h3><p class="muted">Rate badlo, dish khatam karo ya photo upload karo — tabdeeli foran menu me lag jati hai. Asli version me client ki apni photos yahin se lagengi.</p>' + adminRows +
    '<div class="center mt"><button class="btn btn-outline btn-small" onclick="resetMenuEdits()">Menu reset karo</button></div>' +
    '<h3>Customers</h3>' + customersHtml +
    '<div class="center mt"><button class="btn btn-small" onclick="exportCSV()">Customers CSV download karo</button></div>' +
    '<h3>Demo reviews</h3>' + reviewsHtml +
    '<h3>Private feedback</h3>' + fbHtml + '</div>';
}

function setPrice(id, v) {
  const n = parseInt(v, 10);
  if (isNaN(n) || n < 0) return;
  if (!state.menuEdits[id]) state.menuEdits[id] = {};
  state.menuEdits[id].price = n;
  save();
  showToast('Rate update ho gaya (demo).');
}

function setSoldOut(id, checked) {
  if (!state.menuEdits[id]) state.menuEdits[id] = {};
  state.menuEdits[id].soldOut = !!checked;
  save();
  showToast(checked ? 'Dish khatam mark ho gayi (demo).' : 'Dish wapas available hai (demo).');
}

function setPhoto(id, input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = function () {
    if (!state.menuEdits[id]) state.menuEdits[id] = {};
    state.menuEdits[id].photo = rd.result;
    save();
    renderAll();
    showToast('Photo lag gayi (demo).');
  };
  rd.readAsDataURL(f);
}

function resetMenuEdits() {
  state.menuEdits = {};
  save();
  renderAll();
  showToast('Menu wapas original ho gaya.');
}

function approveStamps() {
  const el = document.getElementById('staff-pin');
  const pin = el ? el.value : '';
  if (pin !== CONFIG.staffPin) {
    showToast('Ghalat PIN. Demo staff PIN: 1234.');
    return;
  }
  if (state.pendingStamps <= 0) {
    showToast('Koi pending stamp nahi hai.');
    return;
  }
  const gained = state.pendingStamps;
  state.you.stamps += gained;
  state.you.justStamped = gained;
  state.pendingStamps = 0;
  save();
  setMode('customer');
  tab = 'stamps';
  renderAll();
  showToast(gained + ' ' + plural(gained, 'stamp', 'stamps') + ' lag gaye! Total: ' + state.you.stamps);
}

function exportCSV() {
  const head = 'Name,Phone,Days Away,Stamps,Orders,Spent,Offers Consent\n';
  const rows = state.customers.map(function (c) {
    return [c.name, c.phone, c.days, c.stamps, c.orders, c.spent, c.consent ? 'Yes' : 'No'].join(',');
  }).join('\n');
  const blob = new Blob([head + rows], { type: 'text/csv' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'roast-room-customers-demo.csv';
  a.click();
  showToast('CSV download shuru (demo data).');
}

const TOUR_STEPS = [
  { mode: 'customer', tab: 'menu', title: 'Step 1 — Customer Menu', text: 'Customer menu se order karta hai: Add dabane par neeche se patti khulti hai — size, doodh, table number aur note ke saath. Neeche cart ki patti nazar aati hai.' },
  { mode: 'customer', tab: 'stamps', title: 'Step 2 — Stamp Card', text: 'Har coffee par stamp. Card par cup ke nishan hain, aur naya stamp pop animation ke saath lagta hai. 5 par free coffee, 10 par free dessert.' },
  { mode: 'owner', tab: 'dashboard', title: 'Step 3 — Owner View (PIN)', text: 'Owner View PIN 1234 se khulta hai. Andar dashboard, graph, kitchen slip, Stamps tab (staff stamp approval) aur menu admin hai.' },
  { mode: 'owner', tab: 'comeback', title: 'Step 4 — Come Back List', text: '21+ din door customers, din ke rang (laal, narangi, peela), aur sirf ijazat wale customers ko WhatsApp offer. Wapas aane par count dashboard me barhta hai.' }
];

function startTour() {
  tourActive = true;
  tourIndex = 0;
  tourApply();
}

function tourApply() {
  const step = TOUR_STEPS[tourIndex];
  mode = step.mode;
  tab = step.tab;
  renderAll();
  renderTourModal();
}

function renderTourModal() {
  const step = TOUR_STEPS[tourIndex];
  const isLast = tourIndex === TOUR_STEPS.length - 1;
  const needsPin = (step.mode === 'owner' && !ownerUnlocked);
  const body = needsPin
    ? '<p class="muted">Owner View locked hai. Demo PIN daalo, phir agla step khulega.</p>' +
      '<input type="password" id="tour-pin" placeholder="Owner PIN (demo: 1234)">' +
      '<div class="center mt"><button class="btn btn-gold" onclick="tourUnlock()">Unlock aur Agla</button> <button class="btn btn-outline" onclick="tourClose()">Band karo</button></div>'
    : '<div class="center mt">' +
      (isLast
        ? '<button class="btn btn-gold" onclick="tourClose()">Tour khatam</button>'
        : '<button class="btn btn-gold" onclick="tourNext()">Agla</button>') +
      ' <button class="btn btn-outline" onclick="tourClose()">Band karo</button></div>';
  openModal(step.title + ' (' + (tourIndex + 1) + '/4)', '<p>' + step.text + '</p>' + body);
}

function tourNext() {
  if (tourIndex >= TOUR_STEPS.length - 1) {
    tourClose();
    return;
  }
  tourIndex += 1;
  tourApply();
}

function tourUnlock() {
  const el = document.getElementById('tour-pin');
  const pin = el ? el.value : '';
  if (pin !== CONFIG.ownerPin) {
    showToast('Ghalat PIN. Demo PIN: 1234.');
    return;
  }
  ownerUnlocked = true;
  tourNext();
}

function tourClose() {
  tourActive = false;
  closeModal();
  renderAll();
}

/* ---------- Modal, reset, render ---------- */

function openModal(title, bodyHtml) {
  const wrap = document.getElementById('modal-wrap');
  wrap.innerHTML = '<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>' + title + '</h2>' + bodyHtml + '</div></div>';
  wrap.classList.remove('hidden');
}

function closeModal() {
  const wrap = document.getElementById('modal-wrap');
  wrap.innerHTML = '';
  wrap.classList.add('hidden');
}

function resetDemo() {
  state = seedState();
  cart = {};
  mode = 'customer';
  tab = 'menu';
  menuCat = 'all';
  comebackFilter = 'door';
  ownerUnlocked = false;
  save();
  renderAll();
  showToast('Demo data restored.');
}

function renderAll() {
  renderTabs();
  renderMenu();
  renderStamps();
  renderRewards();
  renderComeback();
  renderDashboard();
  renderStampApproval();
  renderPin();
  renderCartStrip();
  const ownerLocked = (mode === 'owner' && !ownerUnlocked);
  const views = ['menu', 'stamps', 'rewards', 'comeback', 'dashboard', 'stamp-approval', 'pin'];
  views.forEach(function (id) {
    const show = ownerLocked ? (id === 'pin') : (tab === id);
    document.getElementById('view-' + id).classList.toggle('hidden', !show);
  });
}

applyConfig();
renderAll();
</script>
</body>
</html>
